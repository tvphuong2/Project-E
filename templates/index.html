{% extends "base.html" %}
{% block content %}
<div class="grid grid-2">
  <div class="card">
    <h3>Tạo bài học</h3>
    <form action="/lessons/create" method="post" enctype="multipart/form-data">
      <label>Tiêu đề</label>
      <input name="title" required>
      <label>Media (audio/video)</label>
      <input type="file" name="media" accept="audio/*,video/*" required>
      <label>Text (nội dung gốc)</label>
      <textarea name="text" placeholder="Dán transcript gốc tại đây..." required></textarea>
      <button class="btn" type="submit">Tạo bài</button>
      <div class="small mono">Text sẽ được chuẩn hoá (LLM + quy tắc) giữ lại chỉ dấu , và .</div>
    </form>
  </div>
  <div class="card">
    <h3>Danh sách bài học</h3>
    <table>
      <tr><th>Tiêu đề</th><th>Ngày</th><th>Actions</th></tr>
      {% for it in lessons %}
      <tr>
        <td>{{ it.title }}</td>
        <td><small>{{ it.created_at }}</small></td>
        <td><a href="/lesson/{{ it.id }}">Mở</a></td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
